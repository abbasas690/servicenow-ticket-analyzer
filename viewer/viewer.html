<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ServiceNow Analyzer — Data</title>
  <style>
    :root { --bg:#171c26; --card:#202839; --line:#323c52; --text:#e8eaed; --dim:#9aa0a6; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:system-ui,sans-serif; font-size:13px; background:var(--bg); color:var(--text); }
    header { display:flex; align-items:baseline; gap:14px; padding:14px 18px 6px; }
    h1 { font-size:16px; margin:0; color:#7ab8f5; white-space:nowrap; }
    #meta { color:var(--dim); font-size:12px; }
    .toolbar { display:flex; gap:10px; align-items:center; padding:8px 18px 12px; position:sticky; top:0;
      background:var(--bg); z-index:2; border-bottom:1px solid var(--line); }
    #search { flex:1; max-width:420px; background:#161c29; color:var(--text); border:1px solid var(--line);
      border-radius:6px; padding:7px 10px; font-size:13px; }
    #count { color:var(--dim); font-size:12px; white-space:nowrap; }
    button { padding:7px 12px; border:none; border-radius:6px; background:#33405c; color:var(--text);
      cursor:pointer; font-weight:600; }
    button:hover { filter:brightness(1.15); }
    #wrap { overflow:auto; height:calc(100vh - 96px); }
    table { border-collapse:collapse; min-width:100%; table-layout:fixed; }
    th, td { text-align:left; padding:6px 12px; border-bottom:1px solid var(--line); white-space:nowrap;
      overflow:hidden; text-overflow:ellipsis; }
    td:not(.editable) { cursor:copy; }
    td:not(.editable):hover { box-shadow:inset 0 0 0 1px #4a5b7d; }
    thead th { position:sticky; top:0; background:#242d40; cursor:pointer; user-select:none;
      font-size:11.5px; text-transform:uppercase; letter-spacing:.4px; color:#b9c2d4; z-index:1; }
    thead th:hover { color:#fff; }
    thead th.sorted::after { content:" ▾"; color:#7ab8f5; }
    thead th.sorted.desc::after { content:" ▴"; }
    tbody tr:hover { background:#242d40; }
    td.num { font-family:monospace; color:#93c5fd; }
    td.time { font-family:monospace; font-size:12px; color:#a7f3d0; }
    td.empty-time { color:#5d6673; }
    td.inst { font-family:monospace; font-size:12px; color:#a7f3d0; }
    td.editable { cursor:cell; }
    td.editable:hover { box-shadow:inset 0 0 0 1px #4a5b7d; }
    td.edit-input { padding:0 !important; }
    td.edit-input input { width:100%; height:calc(100% + 1px); border:none; background:#10141f; color:#fde68a;
      font-family:monospace; font-size:12px; padding:6px 12px; outline:2px solid #2563eb; outline-offset:-2px; }
    td.edit-invalid input { outline-color:#ef4444; }
    tr.flash td { animation:rowflash .9s ease-out; }
    td.copied { animation:copyflash .8s ease-out; }
    @keyframes copyflash { 0% { background:#1d4d2b; color:#a7f3d0; } 100% { background:transparent; } }
    @keyframes rowflash { 0% { background:#3b2f0b; } 100% { } }
    #hint { padding:0 18px 6px; color:#5d6673; font-size:11px; }
    #empty { padding:60px 20px; text-align:center; color:var(--dim); font-size:14px; }
    .hidden { display:none; }
    button.primary { background:#2563eb; color:#fff; }
    #status { color:#4ade80; font-size:12px; min-width:80px; }
    #aiChip { display:inline-flex; align-items:center; gap:8px; background:#3b2f0b; border:1px solid #a16207;
      color:#fde68a; font-size:12px; padding:4px 6px 4px 10px; border-radius:999px; white-space:nowrap; }
    #aiChip.hidden { display:none; }
    #aiStop { padding:2px 10px; font-size:11px; background:#b45309; color:#fff; border:none;
      border-radius:999px; cursor:pointer; font-weight:600; }
    #aiStop:hover { filter:brightness(1.15); }
    #tplState { color:var(--dim); font-size:11.5px; max-width:260px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #tplState.has { color:#93c5fd; cursor:pointer; text-decoration:underline dotted; }
  </style>
</head>
<body>
  <header>
    <h1>ServiceNow Ticket Data</h1>
    <span id="meta"></span>
  </header>
  <div class="toolbar">
    <input id="search" placeholder="Search number, state, group, assignee…">
    <span id="count"></span>
    <span id="status"></span>
    <button id="exportBtn" class="primary">Export to template</button>
    <span id="tplState" title="Pick / change the Excel template"></span>
    <input type="file" id="tplFile" accept=".xlsx" class="hidden">
    <button id="clearBtn">Clear</button>
  </div>
  <div id="hint">Double-click a cell to edit · Enter saves &amp; moves down · Tab moves right · Esc cancels · edits save automatically</div>
  <div id="wrap">
    <table id="tbl">
      <thead></thead>
      <tbody></tbody>
    </table>
  </div>
  <div id="empty" class="hidden">No pulled data yet — run a pull from the side panel first.</div>
  <script src="../lib/xlsx.full.min.js"></script>
  <script src="../lib/vendor/fflate.min.js"></script>
  <script src="../analysis/workbook.js"></script>
  <script src="../analysis/aiextract.js"></script>
  <script src="../analysis/report.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
